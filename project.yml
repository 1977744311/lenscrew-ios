# XcodeGen 工程定义：`xcodegen generate` 产出 LensCrew.xcodeproj
# App target 挂真实 MWDAT；库层（LensCrewKit）零第三方依赖，swift test 不经过这里。
name: LensCrew
options:
  bundleIdPrefix: dev.steven
  # iOS 与 watch target 共源 Watch/Shared/WatchProto.swift，
  # 逐级建组才能让两个 target 引用同一份 group/file reference
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  LensCrewKit:
    path: .
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: 0.8.0
targets:
  LensCrew:
    type: application
    platform: iOS
    sources:
      - App
      # Watch ↔ iPhone 的 WC 载荷契约与手表 target 共源（只挂这一个文件）
      - path: Watch/Shared/WatchProto.swift
    dependencies:
      - package: LensCrewKit
        products:
          - AgentProtocol
          - BridgeLink
          - GlassesKit
          - GlassRenderer
          - LensCrewCore
      - package: MWDAT
        products:
          - MWDATCore
          - MWDATDisplay
          - MWDATMockDevice
      # 手表 app 随 iOS app 分发（Embed Watch Content）
      - target: LensCrewWatch
        embed: true
    # MWDAT 凭据经 xcconfig 注入，真实值放 gitignored 的 Secrets.xcconfig；
    # 缺省空值也能构建（见 Base.xcconfig 注释）
    configFiles:
      Debug: App/Support/Base.xcconfig
      Release: App/Support/Base.xcconfig
    # APNs：审批/轮次推送。真机收推送还需要开发者账号签名，构建本身不依赖
    entitlements:
      path: App/Support/LensCrew.entitlements
      properties:
        aps-environment: development
    info:
      path: App/Support/Info.plist
      properties:
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: 连接 Meta Ray-Ban Display 眼镜需要蓝牙。
        NSCameraUsageDescription: 扫描 Mac 上的配对二维码需要相机。
        NSLocalNetworkUsageDescription: 连接同一网络下 Mac 上的 LensCrew bridge 需要访问本地网络。
        # bridge 跑在局域网里，用明文 HTTP；ATS 只对本地网络放行，公网仍然强制 TLS
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # 眼镜使用者自建时填自己的 Meta 凭据（见 docs/glasses-self-build.md）；
        # 占位来自 Base.xcconfig，空值时 DAT 配置失败但 App 照常启动
        MWDAT:
          DAMEnabled: true
          MetaAppID: $(MWDAT_META_APP_ID)
          ClientToken: $(MWDAT_CLIENT_TOKEN)
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

  # 腕上审批器 + 一瞥（现代单 target 手表 app）。只依赖 AgentProtocol：
  # 手表不引 BridgeLink/SDK 层，不做加密不连网，一切经 iPhone 的 WatchBridge 中转。
  LensCrewWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
    dependencies:
      - package: LensCrewKit
        products:
          - AgentProtocol
      - target: LensCrewWatchWidget
        embed: true
    info:
      path: Watch/Support/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.steven.LensCrew
    # app group 只为给 Smart Stack 小组件递一瞥数据；真机生效需要开发者账号签名
    entitlements:
      path: Watch/Support/LensCrewWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.steven.LensCrew
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        # 手表 app 的 bundle id 必须挂在宿主 iOS app 之下
        PRODUCT_BUNDLE_IDENTIFIER: dev.steven.LensCrew.watchkitapp

  # W4 · Smart Stack 小组件（WidgetKit / accessoryRectangular）。
  # 不依赖 AgentProtocol：数据经 WatchGlanceStore（app group defaults）交接。
  LensCrewWatchWidget:
    type: extensionkit-extension
    platform: watchOS
    sources:
      - WatchWidget
      - path: Watch/Shared/WatchGlanceStore.swift
    info:
      path: WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: LensCrew
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchWidget/LensCrewWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.steven.LensCrew
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        # widget 的 bundle id 必须挂在手表 app 之下
        PRODUCT_BUNDLE_IDENTIFIER: dev.steven.LensCrew.watchkitapp.widget
